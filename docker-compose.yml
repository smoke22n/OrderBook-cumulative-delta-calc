---
services:

  freqtrade-rust:
    image: freqtradeorg/freqtrade:2025.10
    deploy:
      resources:
        limits:
          cpus: "10"
        reservations:
          cpus: "10"
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    container_name: freqtrade_rust
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8090:8090"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy RustOrderbookStrategy
  
  rust_feeder:
    build: ./rust_feeder                  # <--- SOLO LUI DEVE AVERE "BUILD"
    restart: always
    container_name: rust_feeder
    volumes:
      - "./user_data:/data"
